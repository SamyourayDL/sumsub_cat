<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Sumsub demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182d29; background: #f3f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main, footer { max-width: 52rem; margin: auto; padding: 1.5rem; }
    header { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    a { color: #215b49; text-underline-offset: .25em; }
    a:focus-visible { outline: 3px solid #a44b12; outline-offset: 5px; }
    main { padding-top: 4rem; padding-bottom: 4rem; }
    .card { padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #ced8ce; border-radius: 1.5rem; background: #fff; }
    .eyebrow, footer { color: #52615a; font-size: .9rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 1rem 0; }
    p { line-height: 1.65; max-width: 38rem; }
    .button { display: inline-block; margin-top: 1rem; padding: .85rem 1.2rem; border-radius: .65rem; background: #215b49; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a href="/">Sumsub demo</a>
    <nav aria-label="Основная навигация">
      <a href="/">Главная</a>
      <a href="/account">Личный кабинет</a>
    </nav>
  </header>
  <main>
    <section class="card" aria-labelledby="page-heading">
      <p class="eyebrow">Учебный проект</p>
      <h1 id="page-heading">{{.Heading}}</h1>
      <p>{{.Message}}</p>
      <a class="button" href="{{.Link}}">{{.Label}}</a>
    </section>
  </main>
  <footer>Демонстрационный интерфейс. Проверка личности ещё не подключена.</footer>
</body>
</html>
